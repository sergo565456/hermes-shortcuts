name: hermes-shortcuts
label: Hermes Shortcuts
kind: platform
version: 0.2.0
description: >
  Token-authenticated HTTP entry for iOS Shortcuts / Android HTTP Shortcuts:
  Share Sheet (links, text, PDFs, screenshots, photos) with action presets,
  "Hey Siri, ask Hermes" with a synchronous spoken reply, photo-as-task and
  optional event triggers. `hermes shortcuts pair` prints a QR code that pairs the
  iPhone "Hermes Setup" shortcut in one scan. Replies come back in the HTTP response and are
  forwarded to your Telegram (or other) home channel (Siri questions only when you say
  "save the answer" or the request times out). Off until SHORTCUTS_TOKEN
  is set and the plugin is enabled; listens on 127.0.0.1:8645 by default.
requires_hermes: ">=0.23.1"
author: "sergo565456"
platforms:
  - linux
  - macos
provides_hooks:
  - pre_tool_call
  - pre_llm_call
requires_env:
  - name: SHORTCUTS_TOKEN
    description: "Bearer token your phone sends; 32+ random chars, placeholders refused (generate: openssl rand -hex 32)"
    prompt: "Shortcuts bearer token (generate with: openssl rand -hex 32)"
    password: true
optional_env:
  - name: SHORTCUTS_ALLOWED_USERS
    description: "Gateway allowlist for this platform; set to: owner"
    prompt: "Allowed users (use: owner)"
    password: false
  - name: SHORTCUTS_HOST
    description: "Bind address (default 127.0.0.1). Non-loopback needs SHORTCUTS_ALLOW_PUBLIC_BIND=true"
    prompt: "Bind host"
    password: false
  - name: SHORTCUTS_PORT
    description: "Listen port (default 8645)"
    prompt: "Listen port"
    password: false
  - name: SHORTCUTS_ALLOW_PUBLIC_BIND
    description: "Explicit opt-in to bind a non-loopback address (true/false, default false)"
    prompt: "Allow public bind? (true/false)"
    password: false
  - name: SHORTCUTS_SYNC_TIMEOUT
    description: "Seconds to wait for a synchronous reply before answering 'working on it' (default 25)"
    prompt: "Sync timeout seconds"
    password: false
  - name: SHORTCUTS_NOTIFY_TARGET
    description: "Platform whose home channel gets forwarded replies (default: telegram; 'none' disables)"
    prompt: "Notify target"
    password: false
  - name: SHORTCUTS_RATE_LIMIT
    description: "Max accepted requests per minute (default 20)"
    prompt: "Rate limit per minute"
    password: false
  - name: SHORTCUTS_MAX_UPLOAD_MB
    description: "Max upload size in MB (default 15)"
    prompt: "Max upload MB"
    password: false
  - name: SHORTCUTS_MAX_UPLOAD_MB_PER_HOUR
    description: "Total upload budget per hour in MB (default 200)"
    prompt: "Upload MB per hour"
    password: false
  - name: SHORTCUTS_TOOL_PROFILE
    description: "safe (default: per-action toolsets, no terminal/file/code/browser) or full (platform default toolset)"
    prompt: "Tool profile (safe/full)"
    password: false
  - name: SHORTCUTS_MAX_REMINDER_REPEAT
    description: "Max runs of a reminder created from the phone (default 1 = one-shot; max 100). Phone-created jobs can't be removed from the phone"
    prompt: "Max reminder repeats"
    password: false
  - name: SHORTCUTS_CLIENT_IP_HEADER
    description: "Client IP header set by your local tunnel/proxy (e.g. CF-Connecting-IP); used only for the auth lockout, only from a loopback peer"
    prompt: "Client IP header (optional)"
    password: false
  - name: SHORTCUTS_PUBLIC_URL
    description: "Public HTTPS base URL for `hermes shortcuts pair` (default: auto-detect a local cloudflared quick tunnel)"
    prompt: "Public HTTPS URL (optional)"
    password: false

# Settings form for `hermes plugins config hermes-shortcuts` and the Desktop Plugins page.
# Secrets use type: secret and stay in .env under `env:` (never config.yaml). Non-secrets are
# stored in plugins.entries.hermes-shortcuts.settings. An environment variable set with
# `hermes config set` still wins over that, which wins over gateway.platforms.shortcuts.extra.
# redact_text needs Hermes >=0.23.2 and turn_client/session_surface need >=0.23.4. Both are
# detected at runtime; requires_hermes stays >=0.23.1 so older patch releases still load.
config_schema:
  token:
    type: secret
    env: SHORTCUTS_TOKEN
    label: Shortcuts token
    description: "Bearer token the phone sends. At least 32 random characters. Generate with: openssl rand -hex 32. Stored in .env, not config.yaml. The plugin also refuses to listen until SHORTCUTS_TOKEN is set."
  host:
    type: str
    default: "127.0.0.1"
    label: Bind address
    description: "Listen address. The default is loopback. A non-loopback address also needs allow_public_bind."
  port:
    type: int
    default: 8645
    label: Port
    description: "Listen port (1-65535)."
  allow_public_bind:
    type: bool
    default: false
    label: Allow public bind
    description: "Opt in to binding a non-loopback address. Leave this off and use an HTTPS tunnel."
  sync_timeout:
    type: int
    default: 25
    label: Sync timeout
    description: "Seconds to wait for a reply before telling the phone the result will arrive on Telegram (3-120)."
  notify_target:
    type: str
    default: telegram
    label: Notify target
    description: "Platform whose home channel receives forwarded replies. 'none' disables forwarding."
  rate_limit:
    type: int
    default: 20
    label: Rate limit
    description: "Maximum accepted requests per minute (1-600)."
  max_upload_mb:
    type: int
    default: 15
    label: Max upload MB
    description: "Per-request upload cap in megabytes (1-50)."
  max_upload_mb_per_hour:
    type: int
    default: 200
    label: Upload MB per hour
    description: "Total upload budget per hour, to bound media-cache disk use."
  tool_profile:
    type: str
    choices: [safe, full]
    default: safe
    label: Tool profile
    description: "safe limits each action to the toolsets it needs. full uses the platform default toolset."
  max_reminder_repeat:
    type: int
    default: 1
    label: Max reminder repeats
    description: "How many times a reminder created from the phone may run (1-100). 1 means one-shot. The phone cannot delete the job."
  client_ip_header:
    type: str
    default: ""
    label: Client IP header
    description: "Header set by your local tunnel (for example CF-Connecting-IP). Used only for the auth lockout, and only when the TCP peer is loopback."
  public_url:
    type: str
    default: ""
    label: Public URL
    description: "HTTPS base URL that `hermes shortcuts pair` puts in the QR code. Leave empty to auto-detect a local quick tunnel."
